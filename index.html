// Slot index 0..10 maps to a batting/role position.
// Structure: 4 specialist top-order (0-3) + 1 flex middle-order (4 — bat or AR)
//          + 1 all-rounder (5) + 1 keeper (6) + 4 bowlers (7-10).
// This supports BOTH real-world XI shapes:
//   - "Bat 7 deep":   5 bat (incl WK) + 2 AR + 4 bowl  → slot 4 picks an AR
//   - "Bat 8 deep":   6 bat (incl WK) + 1 AR + 4 bowl  → slot 4 picks a batter
const POSITION_LABELS = [
  "Opener", "Opener", "No. 3", "Top order", "Middle order",
  "All-rounder", "Wicket-keeper", "Bowler", "Bowler", "Bowler", "Bowler"
];
// Short hint shown under flex slots so the user knows they can swap shape mid-game.
const POSITION_HINTS = {
  4: "bat or all-rounder",   // flex point that decides 7-deep vs 8-deep
  5: "all-rounder"
};
const WK_SLOT = 6; // slot 6 is the wicket-keeper position behind the stumps

// 1 keeper at top, then 2-3-2-3 arrangement; total = 1 + 2 + 3 + 2 + 3 = 11
// Slot indexes laid out so the keeper (WK_SLOT = 6) sits at top behind stumps.
const FIELD_ROWS = [
  [6],                // Wicket-keeper (top, behind stumps)
  [0, 1],             // Openers
  [2, 3, 4],          // Top order
  [5, 7],             // All-rounders
  [8, 9, 10]          // Bowlers (fast, fast, spinner)
];

// Map player → role-asset key
function roleKey(p) {
  if (p.isWk) return "wk";
  if (p.role === "Batter") return "bat";
  if (p.role === "All-rounder") return "allrounder";
  if (p.role === "Bowler") {
    const spinners = new Set(["murali","warne","kumble","ashwin","jadeja","vettori","narine","rashid","hasaranga","saqlain","herath","mendis","afridi","maxwell","mahmudullah","miraz","nabi"]);
    return spinners.has(p.id) ? "spin" : "fast";
  }
  return "bat";
}

// Asset-or-SVG role badge
function RoleBadge({ player, size=20 }) {
  const k = roleKey(player);
  return (
    <AssetImg
      src={ASSETS.role[k]}
      fallback={<RoleMedallionSVG role={k} size={size}/>}
      style={{ width:size, height:size, display:"block" }}/>
  );
}

// Role icon resolved from player.role + isWk
function roleIcon(p) {
  if (p.isWk) return "🧤";
  if (p.role === "Batter") return "🏏";
  if (p.role === "All-rounder") return "⚙️";
  if (p.role === "Bowler") {
    // crude split: surnames starting with shar/spin/mur/ash/jad/war/kum lean spinner
    const spinners = new Set(["murali","warne","kumble","ashwin","jadeja","vettori","narine","rashid","hasaranga","saqlain","herath","mendis","afridi","maxwell","mahmudullah","miraz","nabi","malinga"]);
    return spinners.has(p.id) ? "🌀" : "💨";
  }
  return "🏏";
}

function Game({ mode, fmt, country, lineup, lineupYears, captainSlot, currentSpin, statTab, setStatTab, onPlace, onSwap, onSetCaptain, onSpin, rearrangesLeft, rearrangeBudget }) {
  const [view, setView] = useState("draft");                  // draft | field
  const [poolPlayer, setPoolPlayer] = useState(null);         // card-action modal target
  const [statsPlayer, setStatsPlayer] = useState(null);       // expanded-stats overlay
  const [activeSelection, setActiveSelection] = useState(null); // player chosen, awaiting field placement
  const [swapPicks, setSwapPicks] = useState([]);
  const [pickerMode, setPickerMode] = useState("place");
  const [statsOpen, setStatsOpen] = useState(false);
  const [sortBy, setSortBy] = useState("overall"); // overall | batting | bowling | fielding
  const [dragPayload, setDragPayload] = useState(null);
  const [dragOverSlot, setDragOverSlot] = useState(null);

  const [reelLeft, setReelLeft] = useState({ value: null, flag: null });
  const [reelRight, setReelRight] = useState({ value: null });
  const [animPhase, setAnimPhase] = useState("idle");
  const animLock = useRef(0);

  const showStats = mode !== "iq";
  const picked = lineup.filter(Boolean);
  const round = picked.length;
  const wkPicked = picked.some(p => p.isWk);
  const auraCount = picked.filter(p => isAura(p.id, fmt)).length;
  const oneReel = (mode === "country"); // Country mode shows only the year reel

  // Reel animation
  useEffect(() => {
    if (!currentSpin) {
      setReelLeft({ value: null, flag: null });
      setReelRight({ value: null });
      setAnimPhase("idle");
      setPoolPlayer(null);
      setSwapPicks([]);
      return;
    }
    const myToken = ++animLock.current;
    const yearPool = [];
    const yearMin = mode === "ipl" ? 2008 : FIRST_YEAR;
    for (let y = yearMin; y <= CURRENT_YEAR; y++) yearPool.push(y);
    // For IPL: use the short franchise code (MI / CSK / RCB / SRH ...) — no font shrinking needed
    const leftPool   = mode === "ipl" ? IPL_FRANCHISES.map(franchiseCode) : COUNTRIES;
    const finalLeft  = mode === "ipl" ? franchiseCode(currentSpin.franchise) : currentSpin.country;
    const finalFlag  = mode === "ipl" ? null : COUNTRY_FLAGS[currentSpin.country];
    const finalFrKey = mode === "ipl" ? currentSpin.franchise : null;
    const finalYear  = currentSpin.year;

    if (oneReel) {
      // Only animate the year reel
      setAnimPhase("spinR");
      setReelLeft({ value: country, flag: COUNTRY_FLAGS[country] });
      const startR = Date.now();
      let ri = 0;
      const tickR = () => {
        if (myToken !== animLock.current) return;
        const e = Date.now() - startR;
        if (e >= 1300) {
          setReelRight({ value: finalYear });
          sfx.reelStop();
          setAnimPhase("ready");
          return;
        }
        setReelRight({ value: yearPool[ri % yearPool.length] });
        sfx.reelTick();
        ri++;
        setTimeout(tickR, 75);
      };
      tickR();
      return () => { animLock.current++; };
    }

    setAnimPhase("spinL");
    setReelLeft({ value: leftPool[0], flag: null });
    setReelRight({ value: "?" });
    const startL = Date.now();
    let li = 0;
    const tickL = () => {
      if (myToken !== animLock.current) return;
      const elapsed = Date.now() - startL;
      if (elapsed >= 1400) {
        setReelLeft({ value: finalLeft, flag: finalFlag, frKey: finalFrKey });
        sfx.reelStop();
        setAnimPhase("spinR");
        setTimeout(() => {
          if (myToken !== animLock.current) return;
          const startR = Date.now();
          let ri = 0;
          const tickR = () => {
            if (myToken !== animLock.current) return;
            const e = Date.now() - startR;
            if (e >= 1100) {
              setReelRight({ value: finalYear });
              sfx.reelStop();
              setAnimPhase("ready");
              return;
            }
            setReelRight({ value: yearPool[ri % yearPool.length] });
            sfx.reelTick();
            ri++;
            setTimeout(tickR, 80);
          };
          tickR();
        }, 320);
        return;
      }
      setReelLeft({ value: leftPool[li % leftPool.length], flag: null });
      sfx.reelTick();
      li++;
      setTimeout(tickL, 85);
    };
    tickL();
    return () => { animLock.current++; };
  }, [currentSpin, mode, country, oneReel]);

  const isSwapping = pickerMode === "swap";
  const isCaptaining = pickerMode === "captain";

  const handleSlotClick = (slotIdx) => {
    if (isCaptaining) {
      if (lineup[slotIdx]) {
        onSetCaptain(slotIdx);
        setPickerMode("place");
      }
      return;
    }
    if (isSwapping) {
      if (!lineup[slotIdx]) return;
      // toggle selection
      setSwapPicks(prev => {
        if (prev.includes(slotIdx)) return prev.filter(x => x !== slotIdx);
        if (prev.length >= 2) return [prev[1], slotIdx];
        return [...prev, slotIdx];
      });
      return;
    }
    // default: place from active selection (chosen via card modal → Select)
    if (activeSelection && !lineup[slotIdx]) {
      onPlace(activeSelection, slotIdx);
      setActiveSelection(null);
    }
  };

  const handleSlotDrop = (e, slotIdx) => {
    e.preventDefault();
    setDragOverSlot(null);
    if (!dragPayload) return;
    if (dragPayload.type === "pool") {
      if (lineup[slotIdx] !== null) { sfx.reject(); return; }
      onPlace(dragPayload.player, slotIdx);
    } else if (dragPayload.type === "slot") {
      if (lineup[slotIdx] === null) { sfx.reject(); return; }
      onSwap(dragPayload.slotIdx, slotIdx);
    }
    setDragPayload(null);
  };

  const performSwap = () => {
    if (swapPicks.length !== 2) return;
    onSwap(swapPicks[0], swapPicks[1]);
    setSwapPicks([]);
    setPickerMode("place");
  };

  const enterSwap = () => {
    if (rearrangesLeft <= 0 || picked.length < 2) return;
    setPickerMode(isSwapping ? "place" : "swap");
    setSwapPicks([]);
    setActiveSelection(null);
  };
  const enterCaptain = () => {
    if (picked.length === 0) return;
    setPickerMode(isCaptaining ? "place" : "captain");
    setActiveSelection(null); setSwapPicks([]);
  };

  const showPool = currentSpin && animPhase === "ready";

  // Sort the candidate pool by the chosen metric (desc), drafted players pushed to the bottom
  const draftedIds = useMemo(() => new Set(lineup.filter(Boolean).map(p => p.id)), [lineup]);
  const sortedPool = useMemo(() => {
    if (!currentSpin || !currentSpin.pool) return [];
    const pool = currentSpin.pool.slice();
    const key = sortBy;
    const score = (p) => {
      const yr = yearlyRatingsFor(p, currentSpin.year, fmt) || (p.formats && p.formats[fmt]) || {};
      if (key === "batting")  return yr.bat  || 0;
      if (key === "bowling")  return yr.bowl || 0;
      if (key === "fielding") return yr.field|| 0;
      return playerOverall(p, yr);
    };
    pool.sort((a, b) => {
      const ad = draftedIds.has(a.id), bd = draftedIds.has(b.id);
      if (ad !== bd) return ad ? 1 : -1; // drafted to bottom
      return score(b) - score(a);
    });
    return pool;
  }, [currentSpin, sortBy, fmt, draftedIds]);
  const swapLabel =
    swapPicks.length === 0 ? `Tap a player to swap` :
    swapPicks.length === 1 ? `Now tap another player` :
    `Swap ${lineup[swapPicks[0]].name.split(" ").slice(-1)[0]} ↔ ${lineup[swapPicks[1]].name.split(" ").slice(-1)[0]}`;

  // Card click handler (from candidate pool OR sidebar slot)
  const handleCardClick = (p) => { sfx.pick(); setPoolPlayer(p); };
  const handleViewStats = () => { setStatsPlayer(poolPlayer); setPoolPlayer(null); };
  const handleSelectFromModal = () => {
    setActiveSelection(poolPlayer);
    setPoolPlayer(null);
    setView("field");
  };
  const handleDropOnField = (slotIdx) => {
    if (!activeSelection) return;
    onPlace(activeSelection, slotIdx);
    setActiveSelection(null);
    setView("draft");
  };

  // Place the current `activeSelection` (from clicking a pool card) into a slot
  const placeFromSelection = (slotIdx) => {
    if (!activeSelection) return false;
    if (lineup[slotIdx] !== null) { sfx.reject(); return false; }
    onPlace(activeSelection, slotIdx);
    setActiveSelection(null);
    return true;
  };

  return (
    <div className="pt-4 space-y-4">
      {/* === Game header strip === */}
      <div className="flex items-center justify-between flex-wrap gap-2 px-1">
        <div>
          <div className="text-xs uppercase tracking-wider text-muted-c font-bold">Spin {Math.min(round+1, 11)} of 11</div>
          <div className="text-base text-soft-c">{
            mode==="ipl" ? "IPL — franchise × year" :
            mode==="country" ? `${COUNTRY_FLAGS[country]} ${country} · ${FORMAT_LABEL[fmt]}` :
            `${FORMAT_LABEL[fmt]} — ${mode==="iq"?"IQ Mode":"Classic"}`}</div>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <span className="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-md font-semibold"
            style={{background:"var(--aura-soft)", color:"var(--aura)"}}>
            <span style={{fontSize:14}}>★</span> Aura {auraCount}/{AURA_CAP}
          </span>
          <span className="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-md font-semibold"
            style={{background: wkPicked ? "var(--accent-soft)" : "var(--warn-soft)", color: wkPicked ? "var(--accent)" : "var(--warn)"}}>
            <span style={{fontSize:14}}>🧤</span> {wkPicked ? "WK ✓" : "WK required by 11"}
          </span>
          {captainSlot != null && (
            <span className="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-md font-bold"
              style={{background:"var(--text-strong)", color:"#fff"}}>
              C · {lineup[captainSlot].name.split(" ").slice(-1)[0]}
            </span>
          )}
        </div>
      </div>

      <div className="grid lg:grid-cols-12 gap-4">
        {/* Left column: SPIN + CANDIDATES */}
        <div className="lg:col-span-8 space-y-4">

          {/* ── SECTION 1 · SPIN ── */}
          <div className="card rounded-xl p-5">
            <div className="text-xs uppercase tracking-wider text-muted-c font-bold mb-3">Spin</div>
            <div className="grid grid-cols-2 gap-3" style={{ gridAutoRows: "1fr" }}>
              <div className="rounded-lg p-4 text-center border border-soft flex flex-col items-center justify-center"
                   style={{background:"var(--surface-1)", minHeight: 120}}>
                <div className="text-[10px] uppercase tracking-wider text-muted-c mb-2 font-bold">{mode==="ipl" ? "Franchise" : "Country"}</div>
                <div className="flex items-center justify-center gap-2.5">
                  {mode === "ipl"
                    ? (reelLeft.frKey
                        ? <FranchiseLogo frKey={reelLeft.frKey} size={42} />
                        : <span className="w-[42px] h-[42px] rounded-full border-2 border-dashed border-soft"></span>)
                    : (reelLeft.flag && <span style={{fontSize:34, lineHeight:1}}>{reelLeft.flag}</span>)}
                  <span className="text-3xl font-black text-strong-c" style={{lineHeight:1}}>
                    {reelLeft.value || "—"}
                  </span>
                </div>
              </div>
              <div className="rounded-lg p-4 text-center border border-soft flex flex-col items-center justify-center"
                   style={{background:"var(--surface-1)", minHeight: 120}}>
                <div className="text-[10px] uppercase tracking-wider text-muted-c mb-2 font-bold">Year</div>
                <div className="text-3xl font-black text-strong-c" style={{lineHeight:1}}>{reelRight.value || "—"}</div>
              </div>
            </div>
            {animPhase === "idle" && round < 11 && (
              <div className="flex justify-center mt-4">
                <button onClick={onSpin}
                  className="px-10 py-3 rounded-md font-bold text-base flex items-center gap-2"
                  style={{background:"var(--accent)", color:"#fff"}}>
                  <span style={{fontSize:16}}>🎲</span>
                  {round === 0 ? "Spin to start" : "Next spin"}
                </button>
              </div>
            )}
            {(animPhase === "spinL" || animPhase === "spinR") && (
              <div className="text-center text-sm text-soft-c mt-3">Spinning…</div>
            )}
            {round >= 11 && animPhase === "idle" && (
              <div className="text-center text-sm accent-c mt-3 font-medium">All 11 picked — finalising shortly.</div>
            )}
          </div>

          {/* ── SECTION 2 · CANDIDATES ── */}
          {showPool && (
            <div className="card rounded-xl p-5">
              <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                <div>
                  <div className="text-xs uppercase tracking-wider text-muted-c font-bold">Candidates</div>
                  <div className="text-sm text-soft-c">
                    {activeSelection
                      ? <>Selected <b className="text-strong-c">{activeSelection.name}</b> — tap a slot on the right →</>
                      : <>Drag a player to a slot, or tap to select then tap a slot.</>}
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {showStats && (
                    <div className="flex items-center gap-1.5">
                      <span className="text-[10px] uppercase tracking-wider text-muted-c font-bold">Sort</span>
                      <select value={sortBy} onChange={e => setSortBy(e.target.value)}
                        className="px-2.5 py-1.5 rounded-md text-xs font-bold border"
                        style={{background:"var(--surface-card)", color:"var(--text-base)", borderColor:"var(--border)"}}>
                        <option value="overall">Overall ↓</option>
                        <option value="batting">Batting ↓</option>
                        <option value="bowling">Bowling ↓</option>
                        <option value="fielding">Fielding ↓</option>
                      </select>
                    </div>
                  )}
                  {showStats && (
                    <button onClick={()=>setStatsOpen(v=>!v)}
                      className="px-4 py-2 rounded-md text-sm font-bold uppercase tracking-wider flex items-center gap-2"
                      style={statsOpen
                        ? { background:"var(--accent)", color:"#fff" }
                        : { background:"var(--surface-1)", color:"var(--text-base)", border:"1px solid var(--border)" }}>
                      <span>📊</span> Stats {statsOpen ? "▴" : "▾"}
                    </button>
                  )}
                </div>
              </div>
              <div className="space-y-2">
                {sortedPool.map(p => {
                  const drafted = draftedIds.has(p.id);
                  return (
                    <PoolPlayerRow
                      key={p.id} player={p} fmt={fmt}
                      year={currentSpin.year}
                      statsOpen={statsOpen} showStats={showStats}
                      selected={activeSelection && activeSelection.id === p.id}
                      drafted={drafted}
                      onClick={() => {
                        if (drafted) { sfx.reject(); return; }
                        sfx.pick();
                        setActiveSelection(prev => (prev && prev.id === p.id) ? null : p);
                      }}
                      onDragStart={() => { if (!drafted) setDragPayload({ type:"pool", player:p }); }}
                      onDragEnd={() => setDragPayload(null)}
                    />
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* ── SECTION 3 · YOUR XI (right grid) ── */}
        <div className="lg:col-span-4">
          <div className="card rounded-xl p-4 sticky top-4">
            <DraftSidebar
              lineup={lineup} lineupYears={lineupYears} fmt={fmt}
              captainSlot={captainSlot}
              swapPicks={swapPicks}
              picked={picked.length}
              rearrangesLeft={rearrangesLeft} rearrangeBudget={rearrangeBudget}
              isSwapping={isSwapping} isCaptaining={isCaptaining}
              activeSelection={activeSelection}
              dragOverSlot={dragOverSlot}
              onSlotClick={(i) => {
                // 1) captain mode → set captain
                if (isCaptaining) { if (lineup[i]) { onSetCaptain(i); setPickerMode("place"); } return; }
                // 2) swap mode → toggle pick
                if (isSwapping) {
                  if (!lineup[i]) return;
                  setSwapPicks(prev => {
                    if (prev.includes(i)) return prev.filter(x => x !== i);
                    if (prev.length >= 2) return [prev[1], i];
                    return [...prev, i];
                  });
                  return;
                }
                // 3) place from pool selection
                if (activeSelection && !lineup[i]) { placeFromSelection(i); }
              }}
              onSlotDrop={(e, i) => {
                e.preventDefault();
                setDragOverSlot(null);
                if (!dragPayload || dragPayload.type !== "pool") return;
                if (lineup[i] !== null) { sfx.reject(); return; }
                onPlace(dragPayload.player, i);
                setDragPayload(null);
              }}
              onSlotDragOver={(e, i) => { e.preventDefault(); setDragOverSlot(i); }}
              onSlotDragLeave={(i) => setDragOverSlot(prev => prev === i ? null : prev)}
              onEnterSwap={enterSwap}
              onPerformSwap={performSwap}
              onCancelSwap={() => { setPickerMode("place"); setSwapPicks([]); }}
              onCaptainClick={enterCaptain}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

/* =============== Parchment player card (used in pool + sidebar) =============== */

    return (
      <div className={`pcard empty rounded p-2 flex flex-col items-center justify-center text-center ${dropReady ? "drop-ready" : ""}`}
        style={{ minHeight: compact ? 70 : 130 }}

        <div className="text-[10px] uppercase tracking-wider" style={{color:"rgba(232,214,168,0.7)"}}>{slotLabel}</div>
      </div>

  const yr = year ? yearlyRatingsFor(player, year, fmt) : (player.formats && player.formats[fmt]);

    <div className="pcard rounded p-2 cursor-pointer relative"

        <div className="pcard-aura-badge" style={{padding:0, background:"transparent", border:"none"}}>
          <AssetImg src={ASSETS.auraStar} fallback={<AuraStarSVG size={22}/>}
            style={{width:22, height:22, display:"block"}}/>

      )}
      {captain && <div className="pcard-captain-badge">C</div>}

          {player.name.split(" ").length > 1
            ? `${player.name.split(" ")[0][0]}. ${player.name.split(" ").slice(-1)[0]}`
            : player.name}
        </div>
        {year && <div className="text-[9px]" style={{ color: "var(--text-soft)", letterSpacing: "0.1em" }}>{year}</div>}
        {!compact && (
          <div className="flex gap-2 mt-1.5 text-[10px]" style={{ color: "var(--text-base)" }}>
            <span title="Batting">🏏 <b>{fmtNum(s.bat)}</b></span>
            <span title="Bowling">⚪ <b>{fmtNum(s.bowl)}</b></span>
            <span title="Fielding">✋ <b>{fmtNum(s.field)}</b></span>
          </div>
        )}
      </div>
    </div>
  );
}

/* =============== Right sidebar with 11 vertical drafted slots =============== */
const SLOT_LABELS_SHORT = ["Opener","Opener","No. 3","Top order","Middle order","All-rounder","Wicket-keeper","Bowler","Bowler","Bowler","Bowler"];
// Role → big clear emoji icon (used in slot rows)
// Role-weighted Overall — respects what kind of player they are.
// Batters aren't penalised for not bowling; pure bowlers aren't penalised for batting tail-end.
function playerOverall(player, yr) {
  const b = yr.bat || 0, w = yr.bowl || 0, f = yr.field || 0;
  let wts;
  if (player.isWk)                          wts = [0.50, 0.00, 0.50];
  else if (player.role === "Batter")        wts = [0.85, 0.00, 0.15];
  else if (player.role === "All-rounder")   wts = [0.40, 0.40, 0.20];
  else if (player.role === "Bowler")        wts = [0.05, 0.85, 0.10];
  else                                      wts = [0.40, 0.40, 0.20];
  return wts[0]*b + wts[1]*w + wts[2]*f;
}

// Defensive: always returns a stats object (falls back to career stats if year is out of range)
function safeYr(player, year, fmt) {
  return (year ? yearlyRatingsFor(player, year, fmt) : null)
      || (player.formats && player.formats[fmt])
      || { bat: 0, bowl: 0, field: 0 };
}

function roleEmoji(player) {
  if (!player) return "";
  if (player.isWk) return "🧤";
  if (player.role === "Batter") return "🏏";
  if (player.role === "All-rounder") return "⚙️";
  if (player.role === "Bowler") {
    const spinners = new Set(["murali","warne","kumble","ashwin","jadeja","vettori","narine","rashid","hasaranga","saqlain","herath","mendis","afridi","maxwell","mahmudullah","miraz","nabi"]);
    return spinners.has(player.id) ? "🌀" : "💨";
  }
  return "🏏";
}

function DraftSidebar({ lineup, lineupYears, fmt, captainSlot, swapPicks, picked, rearrangesLeft, rearrangeBudget,
                       isSwapping, isCaptaining, activeSelection, dragOverSlot,
                       onSlotClick, onSlotDrop, onSlotDragOver, onSlotDragLeave,
                       onEnterSwap, onPerformSwap, onCancelSwap, onCaptainClick }) {
  return (
    <div className="space-y-3">
      {/* Header + Swap/Captain buttons on top of the grid */}
      <div className="flex items-center justify-between px-1">
        <div>

                ×
              </button>
            </>
          ) : (
            <button onClick={onEnterSwap}
              disabled={rearrangesLeft <= 0 || picked < 2}
              className="px-3 py-2 rounded-md text-xs font-bold bg-surface-1 border border-soft hover:bg-surface-2 text-base-c disabled:opacity-40 flex items-center gap-1">

  [9, 50, 92],  // Fast bowler
  [10, 82, 88]  // Spinner
];

                         onSlotClick, onSlotDrop, onSlotDragOver, onSlotDragLeave }) {
  return (
    <div className="flex items-center justify-center" style={{ minHeight: 560 }}>

              <div style={{

                padding: "2px 8px", borderRadius: 3, fontSize: 10,
                border: `1px solid ${isWkSlot ? "var(--brass-bright)" : "var(--brass-dark)"}`,
                whiteSpace: "nowrap", fontFamily: "Georgia, serif", letterSpacing: "0.05em"

// Click a badge → tooltip label appears above for 2.5s
function Badge({ label, size=32, style, children }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {

    const t = setTimeout(() => setOpen(false), 2500);
    return () => clearTimeout(t);
  }, [open]);
  return (
    <span className="relative inline-flex">
      <button
        type="button"
        onClick={(e) => { e.stopPropagation(); setOpen(v => !v); }}
        className="rounded-full flex items-center justify-center font-bold shrink-0"
        style={{ width:size, height:size, lineHeight:1, ...style }}>
        {children}

      {open && (
        <span className="absolute bottom-full left-1/2 mb-1.5 px-2 py-1 rounded text-[10px] font-bold whitespace-nowrap pointer-events-none"

function FieldSlot({ idx, player, selectedPlayer, swapSelected, isCaptain, isDragOver, canSwap,
                     onClick, onDragStart, onDragEnd, onDragOver, onDragLeave, onDrop }) {
  const empty = !player;
  const role = POSITION_LABELS[idx];
  const isWkSlot = idx === WK_SLOT;
  // A player is "incompatible" to drop here only if it's the WK slot and the player isn't a WK
  const incompatible = empty && isWkSlot && selectedPlayer && !selectedPlayer.isWk;
  const dropReady = empty
    ? (selectedPlayer && !incompatible) || isDragOver
    : (isDragOver && canSwap);
  return (
    <div
      onClick={onClick}
      onDragOver={onDragOver}
      onDragLeave={onDragLeave}
      onDrop={onDrop}
      draggable={!empty && canSwap}
      onDragStart={!empty ? onDragStart : undefined}
      onDragEnd={!empty ? onDragEnd : undefined}
      className="flex flex-col items-center gap-1 cursor-pointer">
      {empty ? (
        <div className={`field-slot-empty ${dropReady ? "drop-ready" : ""} ${incompatible ? "opacity-40" : ""}`}>
          {isWkSlot ? <CricketIcon kind="wicket" className="w-5 h-5" /> : ""}
        </div>
      ) : (
        <div className={`field-slot-filled relative ${swapSelected ? "swap-active" : ""}`}>
          <PlayerPhoto playerId={player.id} name={player.name} size={52} />
          {AURA_IDS.has(player.id) && (
            <CricketIcon kind="aura" className="w-3.5 h-3.5 aura-c absolute -top-1 -right-1 bg-white rounded-full p-0.5" />
          )}
          {isCaptain && (
            <span className="absolute -top-1 -left-1 text-[10px] w-4 h-4 rounded-full bg-strong-c font-bold flex items-center justify-center" style={{background:"var(--text-strong)", color:"var(--surface-card)"}}>C</span>

  );
}

/* ==========================================================
   ShareModal — preview the team-card image, share via Web Share API
   on mobile, download / copy-link on desktop.
   ========================================================== */
function ShareModal({ open, onClose, user, lineup, lineupYears, captainSlot, fmt, mode, country, ratings }) {
  const [previewUrl, setPreviewUrl] = useState(null);
  const [blob, setBlob] = useState(null);
  const [busy, setBusy] = useState(false);
  const [copied, setCopied] = useState(false);
  const longLink = challengeURL({
    n: fullName(user) || "A player",
    s: Number(ratings.overall.toFixed(2)),
    m: mode, f: fmt, c: mode === "country" ? country : null
  });
  // Cache the shortened link once the modal opens so every action uses the same short URL.
  const [link, setLink] = useState(longLink);
  const [shortening, setShortening] = useState(false);

  const shareText = `I drafted an XI scoring ${fmtNum(ratings.overall)} in ${tabLabelFor(mode, fmt)} on Cricket World XI. Can you beat it?`;

  useEffect(() => {
    if (!open) return;
    let mounted = true;
    setBusy(true);
    setLink(longLink); setShortening(true);
    // Render team card + shorten URL in parallel
    Promise.all([
      renderTeamCard({ user, lineup, lineupYears, fmt, mode, country, captainSlot, ratings }),
      shortenURL(longLink)
    ]).then(([b, shortLink]) => {
      if (!mounted) return;
      if (b) { setBlob(b); setPreviewUrl(URL.createObjectURL(b)); }
      if (shortLink) setLink(shortLink);
      setShortening(false);
      setBusy(false);
    }).catch(() => { if (mounted) { setBusy(false); setShortening(false); } });
    return () => { mounted = false; if (previewUrl) URL.revokeObjectURL(previewUrl); };
  }, [open]);

  const canNativeShare = typeof navigator !== "undefined" && navigator.share && navigator.canShare;
  const canShareFile = canNativeShare && blob && (() => {
    try {
      const f = new File([blob], "cricket-world-xi.png", { type: "image/png" });
      return navigator.canShare({ files: [f] });
    } catch(e) { return false; }
  })();

  const doNativeShare = async () => {
    try {
      if (canShareFile) {
        const f = new File([blob], "cricket-world-xi.png", { type: "image/png" });
        await navigator.share({ files: [f], title: "Cricket World XI", text: shareText + "\n" + link });
      } else if (navigator.share) {
        await navigator.share({ title: "Cricket World XI", text: shareText, url: link });
      }
    } catch(e) { /* user cancelled */ }
  };
  const doDownload = () => {
    if (!previewUrl) return;
    const a = document.createElement("a");
    a.href = previewUrl;
    a.download = "cricket-world-xi.png";
    document.body.appendChild(a); a.click(); a.remove();
  };
  const doCopyLink = async () => {

              Rendering your team card…

        {/* Short link preview */}

              style={{background:"var(--accent)", color:"#fff"}}>
              Share via apps…

          <a href={whatsappURL} target="_blank" rel="noopener"
            className="px-4 py-2.5 rounded-md font-semibold text-sm flex items-center justify-center gap-2"
            style={{background:"#25D366", color:"#fff"}}>
            WhatsApp
          </a>
          <a href={twitterURL} target="_blank" rel="noopener"
            className="px-4 py-2.5 rounded-md font-semibold text-sm flex items-center justify-center gap-2"
            style={{background:"#1C1917", color:"#fff"}}>
            X / Twitter
          </a>
          <button onClick={doDownload}
            disabled={!previewUrl}
            className="px-4 py-2.5 rounded-md font-semibold text-sm bg-surface-1 border border-soft hover:bg-surface-2 disabled:opacity-40">

          </button>

  const [mainTab, setMainTab] = useState(init.main);
  const [subTab,  setSubTab]  = useState(init.sub || "test");

  const hasSub = (mainTab === "classic" || mainTab === "iq" || mainTab === "country");
  const key = hasSub ? `${mainTab}.${subTab}` : mainTab;

  const mainTabs = [
    { key: "classic", label: "Classic", desc: "Stats visible" },
    { key: "iq",      label: "IQ",      desc: "Stats hidden" },
    { key: "country", label: "Country", desc: "One nation" },
    { key: "ipl",     label: "IPL",     desc: "Franchise × year" }

    { key: "test", label: "Test" },

          <p className="text-soft-c text-sm mt-1">Top 50 per mode &amp; format. Stored on this device.</p>
        </div>
        {entries.length > 0 && (
          <button onClick={onClear} className="text-xs warn-c hover:opacity-80">Clear all</button>
        )}

      {/* Main tabs */}

              background: mainTab === t.key ? "var(--accent)" : "var(--surface-1)",
              color:      mainTab === t.key ? "#fff"           : "var(--text-base)",
              border:     `1px solid ${mainTab === t.key ? "var(--accent)" : "var(--border)"}`

              }}>
              {t.label}

                    <div className="font-bold text-strong-c">
                      {e.name}{mine && <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded font-bold uppercase tracking-wider" style={{background:"var(--accent)", color:"#fff"}}>You</span>}

function PreResult({ lineup, lineupYears, fmt, mode, country, captainSlot, onSetCaptain, onSwap, rearrangesLeft, rearrangeBudget, onLock }) {
  const [swapPicks, setSwapPicks] = useState([]);
  const [showSwapUI, setShowSwapUI] = useState(false);
  const [showCaptainUI, setShowCaptainUI] = useState(captainSlot == null);

  const handleSlotClick = (i) => {
    if (showCaptainUI) { onSetCaptain(i); setShowCaptainUI(false); return; }
    if (showSwapUI) {
      setSwapPicks(prev => {
        if (prev.includes(i)) return prev.filter(x => x !== i);
        if (prev.length >= 2) return [prev[1], i];
        return [...prev, i];
      });
    }
  };
  const doSwap = () => {
    if (swapPicks.length === 2) { onSwap(swapPicks[0], swapPicks[1]); setSwapPicks([]); }
  };

  return (
    <div className="pt-8 max-w-4xl mx-auto">
      <div className="text-center mb-6">
        <h1 className="text-3xl font-black tracking-tight text-strong-c mb-2">XI locked in.</h1>
        <p className="text-soft-c">
          {captainSlot == null
            ? "One last thing — pick your captain. They get a +2% bonus on every score."
            : "Captain set. Use any rearranges you've got left, or lock in the team."}
        </p>
      </div>

      <div className="grid lg:grid-cols-5 gap-4 mb-6">
        <div className="lg:col-span-3 card rounded-xl p-4">
          <div className="font-semibold text-strong-c text-sm mb-3">Your XI</div>
          <div className="space-y-2">
            {lineup.map((p, i) => (
              <DraftSlotRow key={i} idx={i} player={p} year={lineupYears[i]} fmt={fmt}
                isCaptain={captainSlot === i}
                isSwapPicked={swapPicks.includes(i)}
                isWkSlot={i === WK_SLOT}
                dropReady={false}
                onClick={() => handleSlotClick(i)}
                onDragOver={(e)=>e.preventDefault()}
                onDragLeave={()=>{}}
                onDrop={(e)=>e.preventDefault()}/>
            ))}
          </div>
        </div>

        <div className="lg:col-span-2 space-y-3">
          <div className="card rounded-xl p-4">
            <div className="text-xs uppercase tracking-wider text-muted-c mb-2">Captain</div>
            {captainSlot != null ? (
              <div className="flex items-center gap-3 mb-2">
                <PlayerPhoto playerId={lineup[captainSlot].id} name={lineup[captainSlot].name} size={42} />
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-strong-c truncate">{lineup[captainSlot].name}</div>
                  <div className="text-xs text-soft-c">{POSITION_LABELS[captainSlot]} · +2% bonus</div>
                </div>
              </div>
            ) : (
              <div className="text-sm warn-c mb-2">No captain picked yet.</div>
            )}
            <button onClick={() => { setShowCaptainUI(true); setShowSwapUI(false); setSwapPicks([]); }}
              className="w-full px-3 py-2 rounded font-semibold text-sm bg-surface-2 text-base-c hover:bg-surface-3">
              {captainSlot == null ? "Tap a player to make them captain" : "Change captain"}
            </button>
          </div>

          <div className="card rounded-xl p-4">
            <div className="text-xs uppercase tracking-wider text-muted-c mb-2">Rearranges remaining</div>
            <div className="text-2xl font-black text-strong-c mb-2">{rearrangesLeft}/{rearrangeBudget}</div>
            {showSwapUI ? (
              <div className="space-y-2">
                <div className="text-xs text-soft-c">
                  {swapPicks.length === 0 ? "Tap a player on the field…" :
                   swapPicks.length === 1 ? "Now tap another player…" :
                   `Swap ${lineup[swapPicks[0]].name.split(" ").slice(-1)[0]} ↔ ${lineup[swapPicks[1]].name.split(" ").slice(-1)[0]}`}
                </div>
                <div className="flex gap-2">
                  <button onClick={doSwap} disabled={swapPicks.length !== 2}
                    className="flex-1 px-3 py-2 rounded font-semibold text-sm bg-accent-c disabled:opacity-40">
                    Confirm Swap
                  </button>
                  <button onClick={() => { setShowSwapUI(false); setSwapPicks([]); }}
                    className="px-3 py-2 rounded font-semibold text-sm bg-surface-2 text-base-c">Done</button>
                </div>
              </div>
            ) : (
              <button onClick={() => { setShowSwapUI(true); setShowCaptainUI(false); }}
                disabled={rearrangesLeft <= 0}
                className="w-full px-3 py-2 rounded font-semibold text-sm bg-surface-2 text-base-c hover:bg-surface-3 disabled:opacity-40">
                ↔ Use a rearrange
              </button>
            )}
          </div>

          <button onClick={onLock}
            className="w-full px-6 py-3 rounded-md bg-accent-c font-bold text-base">
            Lock team in →
          </button>
        </div>
      </div>
    </div>
  );
}

function Computing() {
  const [dots, setDots] = useState(1);
  const [phase, setPhase] = useState(0);
  const phases = [
    "Simulating innings",
    "Calculating partnerships",
    "Counting wickets",
    "Computing fielding chances",
    "Tallying aura points",
    "Applying captain bonus",
    "Finalising verdict"
  ];
  useEffect(() => {
    const d = setInterval(() => setDots(x => (x % 3) + 1), 350);
    const p = setInterval(() => setPhase(x => Math.min(phases.length - 1, x + 1)), 280);
    return () => { clearInterval(d); clearInterval(p); };
  }, []);
  return (
    <div className="pt-24 max-w-md mx-auto text-center">
      <div className="relative mx-auto w-28 h-28 mb-6">
        <div className="absolute inset-0 rounded-full border-4 border-soft"></div>
        <div className="absolute inset-0 rounded-full border-4 border-transparent" style={{ borderTopColor: "var(--accent)", animation: "spin 1.1s linear infinite" }}></div>
        <div className="absolute inset-0 flex items-center justify-center accent-c">
          <CricketIcon kind="ball" className="w-10 h-10"/>
        </div>
      </div>
      <div className="text-2xl font-black text-strong-c mb-2">Computing your XI{".".repeat(dots)}</div>
      <div className="text-sm text-soft-c h-5">{phases[phase]}{".".repeat(dots)}</div>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

          <li className="ml-4 text-soft-c">Batter — 85% bat, 0% bowl, 15% field</li>
          <li className="ml-4 text-soft-c">Wicketkeeper — 50% bat, 0% bowl, 50% field</li>
          <li className="ml-4 text-soft-c">All-rounder — 40% bat, 40% bowl, 20% field</li>
          <li className="ml-4 text-soft-c">Bowler — 5% bat, 85% bowl, 10% field</li>
          <li><b>Team Bat</b> = average of all credible batters in the XI (batters + WK + ARs). Goes up if you bat deep.</li>
          <li><b>Team Bowl</b> = average of all bowlers + ARs.</li>
          <li><b>Team Field</b> = average across all 11.</li>
          <li><b>Team Overall</b> = average of each player’s role-weighted Overall + Aura bonus (+1 per legend, max 4) + Captain bonus (+2%).</li>
        </ul>
      </section>

      <section className="card rounded-xl p-6">
        <h2 className="font-bold text-strong-c mb-3">Verdict tiers</h2>
        <div className="text-sm space-y-1.5 text-base-c">
          <div><span className="font-bold" style={{color:"var(--aura)"}}>GOD TIER</span> — 94+ </div>
          <div><span className="font-bold" style={{color:"var(--aura)"}}>LEGENDARY</span> — 89–93</div>
          <div><span className="font-bold accent-c">ELITE</span> — 84–88</div>
          <div><span className="font-bold accent-c">WORLD CLASS</span> — 78–83</div>
          <div><span className="font-bold info-c">SOLID</span> — 72–77</div>
          <div><span className="font-bold text-soft-c">AVERAGE</span> — 64–71</div>
          <div><span className="font-bold warn-c">REBUILDING</span> — &lt; 64</div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
